  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F4F7F7;
      color: #10242A;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    .nf-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #9EB0B4;
      border-radius: 4px;
      background-color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .nf-checkbox:hover {
      border-color: #046A5B;
    }
    .nf-checkbox:checked {
      background-color: #FFFFFF;
      border-color: #046A5B;
    }
    .nf-checkbox:checked::after {
      content: '';
      width: 10px;
      height: 6px;
      border-left: 2px solid #046A5B;
      border-bottom: 2px solid #046A5B;
      transform: rotate(-45deg) translate(1px, -1px);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #F1F5F5;
      border-radius: 999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #C4D0D2;
      border-radius: 999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #9FB0B3;
    }
    @keyframes nf-slide-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .nf-portal-prompt {
      animation: nf-slide-in 0.35s ease-out;
    }

    // =========================================================================
    // APPLICATION STATE
    // =========================================================================
    const state = {
      screen: 'dashboard',
      dashboardLayout: 'sidebar',
      searchQuery: '',
      planImported: false,
      yourCourses: [],
      savedCourseIds: [],
      waitlistedCourseIds: [],
      modal: null,
      lastSavedWaitlistedCourses: [],
      alternativeCheckedIds: [],
      showTakenInAlternatives: false,
      showPortalPrompt: false,
      dismissedPortalPrompt: false
    };

    // =========================================================================
    // HELPER FUNCTIONS
    // =========================================================================
    function getCourse(id) { return COURSE_CATALOG.find(c => c.id === id); }
    function isCourseInYourList(id) { return state.yourCourses.some(item => item.courseId === id); }
    function isCourseChecked(id) {
      const found = state.yourCourses.find(item => item.courseId === id);
      return found ? found.checked : false;
    }

    function hasTimeConflict(candidate, scheduledCourses) {
      for (const existing of scheduledCourses) {
        if (existing.id === candidate.id) return true;
        if (existing.seatsAvailable === 0) continue;
        const sharedDay = candidate.days.some(d => existing.days.includes(d));
        if (sharedDay) {
          const candEnd = candidate.startHour + candidate.durationHours;
          const existEnd = existing.startHour + existing.durationHours;
          if (candidate.startHour < existEnd && candEnd > existing.startHour) return true;
        }
      }
      return false;
    }

    function getNonConflictingAlternatives() {
      const activeOpenCourses = state.yourCourses
        .map(item => getCourse(item.courseId))
        .filter(c => c && c.seatsAvailable > 0);
      return COURSE_CATALOG
        .filter(c => c.seatsAvailable > 0 && !isCourseInYourList(c.id) && !hasTimeConflict(c, activeOpenCourses))
        .slice(0, 4);
    }

    function getOutstandingRequirementCourses() {
      const out = [];
      DEGREE_REQUIREMENTS.forEach(req => {
        req.remainingOptions.forEach(opt => {
          const code = opt.split(' · ')[0].trim();
          const title = opt.split(' · ')[1] ? opt.split(' · ')[1].replace(/\s*\(\d+\s*cr\)\s*$/, '').trim() : '';
          const creditsMatch = opt.match(/\((\d+)\s*cr\)/);
          const credits = creditsMatch ? Number(creditsMatch[1]) : null;
          out.push({ code, title, credits, area: req.area, raw: opt });
        });
      });
      return out;
    }

    // =========================================================================
    // STATE MUTATIONS & ACTIONS
    // =========================================================================
    function toggleCourseSelection(courseId) {
      const idx = state.yourCourses.findIndex(item => item.courseId === courseId);
      if (idx === -1) {
        state.yourCourses.push({ courseId, checked: true, status: 'selected' });
      } else {
        state.yourCourses[idx].checked = !state.yourCourses[idx].checked;
      }
      render();
    }

    function toggleYourCourseCheckbox(courseId) {
      const item = state.yourCourses.find(c => c.courseId === courseId);
      if (item) { item.checked = !item.checked; render(); }
    }

    function importSpringPlan() {
      const planCourses = COURSE_CATALOG.filter(c => c.inSavedPlan);
      state.planImported = true;
      state.yourCourses = planCourses.map(c => ({
        courseId: c.id,
        checked: true,
        status: c.seatsAvailable === 0 ? 'waitlist_pending' : 'imported'
      }));
      render();
    }

    function handleAddCoursesToSchedule() {
      const checkedItems = state.yourCourses.filter(item => item.checked);
      if (checkedItems.length === 0) {
        state.modal = 'selection_required';
        render();
        return;
      }

      const newlyWaitlisted = [];

      checkedItems.forEach(item => {
        const course = getCourse(item.courseId);
        if (!course) return;
        if (course.seatsAvailable === 0) {
          item.status = 'waitlisted';
          if (!state.waitlistedCourseIds.includes(course.id)) state.waitlistedCourseIds.push(course.id);
          newlyWaitlisted.push(course);
        } else {
          item.status = 'saved';
          if (!state.savedCourseIds.includes(course.id)) state.savedCourseIds.push(course.id);
        }
        item.checked = false;
      });

      state.lastSavedWaitlistedCourses = newlyWaitlisted;
      // Show portal prompt after any successful save
      if (state.savedCourseIds.length + state.waitlistedCourseIds.length > 0) {
        state.showPortalPrompt = true;
      }
      state.modal = 'courses_saved';
      render();
    }

    function handleRemoveSelectedCourses() {
      const checkedItems = state.yourCourses.filter(item => item.checked);
      if (checkedItems.length === 0) {
        state.modal = 'selection_required';
        render();
        return;
      }

      const idsToRemove = checkedItems.map(i => i.courseId);
      state.yourCourses = state.yourCourses.filter(item => !idsToRemove.includes(item.courseId));
      state.savedCourseIds = state.savedCourseIds.filter(id => !idsToRemove.includes(id));
      state.waitlistedCourseIds = state.waitlistedCourseIds.filter(id => !idsToRemove.includes(id));

      if (state.yourCourses.length === 0) state.planImported = false;
      // Hide the portal prompt if no saved courses remain
      if (state.savedCourseIds.length + state.waitlistedCourseIds.length === 0) {
        state.showPortalPrompt = false;
      }
      render();
    }

    function handleConfirmationContinue() {
      if (state.lastSavedWaitlistedCourses.length > 0) {
        state.modal = 'waitlist_added';
      } else {
        state.modal = null;
      }
      render();
    }

    function openExploreAlternatives() {
      state.alternativeCheckedIds = [];
      state.showTakenInAlternatives = false;
      state.modal = 'explore_alternatives';
      render();
    }

    function addAlternativesToYourList() {
      state.alternativeCheckedIds.forEach(id => {
        if (!isCourseInYourList(id)) {
          state.yourCourses.push({ courseId: id, checked: false, status: 'selected' });
        }
      });
      state.modal = null;
      render();
    }

    // =========================================================================
    // RENDER: FLOATING PORTAL PROMPT (bottom-right corner)
    // =========================================================================
    function renderPortalPrompt() {
      const shouldShow =
        state.showPortalPrompt &&
        !state.dismissedPortalPrompt &&
        (state.savedCourseIds.length + state.waitlistedCourseIds.length > 0) &&
        state.screen === 'register';

      if (!shouldShow) return '';

      const enrolledCount = state.savedCourseIds.length;
      const waitlistedCount = state.waitlistedCourseIds.length;
      const parts = [];
      if (enrolledCount > 0) parts.push(`${enrolledCount} enrolled`);
      if (waitlistedCount > 0) parts.push(`${waitlistedCount} waitlisted`);
      const summary = parts.join(' · ');

      return `

            >
              Stay here
            </button>
          </div>
        </div>

    }

    // =========================================================================

    // =========================================================================
    function renderRegister() {
      const q = state.searchQuery.trim().toLowerCase();
      const filteredCourses = COURSE_CATALOG.filter(c =>
        !q ||
        c.code.toLowerCase().includes(q) ||
        c.title.toLowerCase().includes(q) ||
        c.reqArea.toLowerCase().includes(q)
      );

      const scheduledOpenCourses = state.yourCourses
        .map(item => ({ item, course: getCourse(item.courseId) }))
        .filter(entry => entry.course && entry.course.seatsAvailable > 0);

      const days = ['MON', 'TUE', 'WED', 'THU', 'FRI'];
      const hours = [9, 10, 11, 12, 13, 14, 15, 16];

      const formatHourLabel = h => {
        if (h === 12) return '12:00';
        return h > 12 ? `${h - 12}:00` : `${h}:00`;
      };

      const totalCreditsSelected = state.yourCourses.reduce((sum, item) => {

        return sum + (c ? c.credits : 0);
      }, 0);

      return `

                <span>View HCDE Degree Requirements & Taken Courses</span>
              </button>
              <div class="text-xs font-medium text-nf-muted bg-white border border-nf-border px-3 py-2 rounded-lg">
                ${PERSONA.name} · ID ${PERSONA.id} · Sophomore (BSE HCDE)
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6">
            <div class="lg:col-span-8 bg-white border border-nf-border rounded-xl px-4 py-3 flex flex-col justify-center">
              <label for="courseSearchInput" class="text-[10px] font-bold tracking-wider text-nf-muted uppercase mb-1">SEARCH COURSES</label>
              <div class="flex items-center gap-2">
                <input
                  id="courseSearchInput"
                  type="text"
                  value="${state.searchQuery.replace(/"/g, '&quot;')}"
                  placeholder="Search by course title, code, or HCDE requirement..."
                  class="w-full text-[14px] text-nf-ink placeholder-nf-muted focus:outline-none bg-transparent"
                />
                ${state.searchQuery ? `
                  <button type="button" data-action="clear-search" class="text-xs text-nf-muted hover:text-nf-ink font-medium px-2">Clear</button>
                ` : ''}
              </div>
            </div>

            <div class="lg:col-span-4">
              ${state.planImported ? `
                <div class="h-full bg-nf-mint border border-nf-mintBorder rounded-xl px-5 py-3.5 flex items-center justify-between">
                  <div>
                    <div class="text-[15px] font-bold text-nf-teal">Spring 2027 plan imported</div>
                    <div class="text-xs text-nf-teal/90 mt-0.5">Saved Spring 2027 plan · 4 courses · 15 credits</div>
                  </div>
                  <span class="text-[11px] font-semibold text-nf-teal bg-white/80 px-2.5 py-1 rounded-md">Imported</span>
                </div>
              ` : `
                <button type="button" data-action="import-plan" class="w-full h-full bg-nf-teal hover:bg-nf-tealHover text-white rounded-xl px-5 py-3.5 text-left transition shadow-xs flex items-center justify-between">
                  <div>
                    <div class="text-[15px] font-bold">Import course plan</div>
                    <div class="text-xs text-teal-100 mt-0.5">Saved Spring 2027 plan · 4 courses · 15 credits</div>
                  </div>
                  <span class="text-xs font-semibold bg-white/15 px-2.5 py-1 rounded-md">Import →</span>
                </button>
              `}
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">

            <section class="lg:col-span-5 bg-white border border-nf-border rounded-2xl p-5 flex flex-col">
              <div class="flex items-center justify-between mb-1">
                <h2 class="text-[17px] font-bold text-nf-ink">Available courses</h2>
                <span class="text-xs text-nf-muted font-medium">${filteredCourses.length} courses</span>
              </div>
              <div class="text-xs text-nf-muted mb-3.5">BSE HCDE & General · Spring 2027</div>

              <div class="custom-scroll overflow-y-auto max-h-[540px] pr-1.5 space-y-3 flex-1">
                ${filteredCourses.length === 0 ? `
                  <div class="bg-nf-surface border border-nf-border rounded-xl p-6 text-center text-xs text-nf-muted">
                    No courses match "${state.searchQuery}".

                ` : filteredCourses.map(course => {
                  const isFull = course.seatsAvailable === 0;
                  const checked = isCourseChecked(course.id);
                  const inList = isCourseInYourList(course.id);
                  return `
                    <div class="border ${inList ? 'border-nf-teal/50 bg-nf-surface/70' : 'border-nf-border bg-white'} rounded-xl p-4 transition hover:border-nf-teal/60">
                      <div class="flex items-start justify-between gap-2">
                        <label class="flex items-center gap-2.5 cursor-pointer">
                          <input
                            type="checkbox"
                            class="nf-checkbox"
                            data-action="toggle-catalog-course"
                            data-course-id="${course.id}"
                            ${checked ? 'checked' : ''}
                          />
                          <span class="text-[13px] font-bold ${isFull ? 'text-nf-amberText' : 'text-nf-teal'}">${course.code}</span>

                        <div class="font-semibold">${course.seatsAvailable} seats available</div>
                        <div class="opacity-90 mt-0.5">${course.waitlistAvailable} waitlist seats available</div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>

            <section class="lg:col-span-4 bg-white border border-nf-border rounded-2xl p-5 flex flex-col">

                <h2 class="text-[17px] font-bold text-nf-ink">Your schedule</h2>
                <span class="text-xs font-medium text-nf-muted">${totalCreditsSelected} credits in list</span>
              </div>

              <div class="bg-nf-surface border border-nf-border/80 rounded-xl px-4 py-3 mb-4">

                <div class="text-xs text-nf-muted mt-0.5">Full courses join the waitlist and do not reserve a time slot.</div>
              </div>

              <div class="flex-1 overflow-x-auto">
                <div class="min-w-[340px]">
                  <div class="grid grid-cols-6 gap-1.5 mb-2 text-[10px] font-bold tracking-wider text-nf-muted uppercase text-center">
                    <div class="text-left pl-1">TIME</div>
                    ${days.map(d => `<div>${d}</div>`).join('')}
                  </div>

                  <div class="relative border border-nf-border/70 rounded-xl overflow-hidden bg-nf-surface/50">
                    ${hours.map((hour, rowIdx) => `
                      <div class="grid grid-cols-6 border-b last:border-b-0 border-nf-border/60 h-[54px]">
                        <div class="text-[11px] text-nf-muted font-medium px-2 pt-1.5 bg-white border-r border-nf-border/60">
                          ${formatHourLabel(hour)}
                        </div>
                        ${days.map(day => {
                          const matchingEntry = scheduledOpenCourses.find(entry =>
                            entry.course.days.includes(day) &&
                            Math.floor(entry.course.startHour) === hour
                          );

                          if (matchingEntry) {
                            const { item, course } = matchingEntry;
                            const isSaved = item.status === 'saved';
                            const topOffset = (course.startHour - hour) * 54;
                            const blockHeight = Math.max(46, course.durationHours * 54 - 4);
                            return `
                              <div class="relative p-0.5 ${rowIdx % 2 === 1 ? 'bg-nf-surface' : 'bg-white/70'}">
                                <div
                                  style="top: ${topOffset + 2}px; height: ${blockHeight}px;"
                                  class="absolute inset-x-1 z-10 rounded-lg px-2 py-1.5 border shadow-2xs flex flex-col justify-center ${
                                    isSaved
                                      ? 'bg-nf-mint border-nf-mintBorder text-nf-teal'
                                      : 'bg-nf-amberBg/90 border-amber-200 text-nf-amberText'
                                  }"
                                >
                                  <div class="text-[11px] font-bold leading-tight">${course.code}</div>
                                  <div class="text-[9px] leading-tight mt-0.5 opacity-90">${course.timeLabel.replace(' AM', '').replace(' PM', '')}</div>
                                </div>
                              </div>
                            `;
                          }

                          return `<div class="${rowIdx % 2 === 1 ? 'bg-nf-surface' : 'bg-white/60'}"></div>`;
                        }).join('')}
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>

              <div class="text-xs text-nf-muted mt-3 pt-2">
                Select courses, then save to confirm your changes.
              </div>
            </section>

            <section class="lg:col-span-3 bg-white border border-nf-border rounded-2xl p-5 flex flex-col">

                <h2 class="text-[17px] font-bold text-nf-ink">Your courses</h2>
                <span class="text-xs font-semibold text-nf-teal">${state.yourCourses.length}</span>
              </div>
              <p class="text-xs text-nf-muted mb-4 leading-relaxed">
                Check courses to add or remove, then use the buttons below.
              </p>

              <div class="custom-scroll overflow-y-auto max-h-[520px] space-y-3 flex-1">
                ${state.yourCourses.length === 0 ? `
                  <div class="bg-nf-surface border border-nf-border/80 rounded-xl p-5">
                    <div class="text-[13px] font-bold text-nf-ink">Your course list is empty</div>
                    <div class="text-xs text-nf-muted mt-1 leading-relaxed">
                      Select courses in the catalog or import your saved course plan.
                    </div>
                  </div>
                ` : state.yourCourses.map(item => {
                  const course = getCourse(item.courseId);
                  if (!course) return '';
                  const isFull = course.seatsAvailable === 0;
                  const isSaved = item.status === 'saved';
                  const isWaitlisted = item.status === 'waitlisted';

                  let statusText = 'Selected · not saved';
                  let statusColor = 'text-nf-teal';
                  let cardStyle = 'bg-nf-surface border-nf-border';

                  if (isWaitlisted) {
                    statusText = 'On waitlist · saved';
                    statusColor = 'text-nf-amberText';
                    cardStyle = 'bg-nf-amberBg/85 border-amber-200';
                  } else if (isFull) {
                    statusText = 'Full · waitlist on save';
                    statusColor = 'text-nf-amberText';
                    cardStyle = 'bg-nf-amberBg/85 border-amber-200';
                  } else if (isSaved) {
                    statusText = 'Enrolled · saved to schedule';
                    statusColor = 'text-nf-teal';
                    cardStyle = 'bg-nf-mint/60 border-nf-mintBorder';
                  } else if (item.status === 'imported') {
                    statusText = 'Imported · not saved';
                    statusColor = 'text-nf-teal';
                    cardStyle = 'bg-nf-surface border-nf-border';
                  }

                  return `
                    <div class="border rounded-xl p-3.5 transition ${cardStyle}">
                      <label class="flex items-center gap-2.5 cursor-pointer">
                        <input
                          type="checkbox"
                          class="nf-checkbox"
                          data-action="toggle-your-course"
                          data-course-id="${course.id}"
                          ${item.checked ? 'checked' : ''}
                        />
                        <span class="text-[13px] font-bold text-nf-ink">${course.code}</span>
                      </label>
                      <div class="text-[13px] font-semibold text-nf-ink mt-1.5 leading-snug">${course.title}</div>
                      <div class="text-[11px] text-nf-muted mt-1">${course.daysLabel} · ${course.timeLabel}</div>
                      <div class="text-[11px] font-semibold ${statusColor} mt-2">${statusText}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          </div>

          <div class="mt-6 bg-white border border-nf-border rounded-2xl px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-xs">
            <div>
              <div class="text-[13px] font-bold text-nf-ink">Selections are not saved automatically.</div>

                Remove

              <button
                type="button"

              >
                Add courses to schedule
              </button>
            </div>
          </div>

          ${renderPortalPrompt()}
        </main>
      `;

          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <section class="lg:col-span-5 bg-white border border-nf-border rounded-2xl p-6">
              <div class="flex items-center justify-between mb-1">
                <h2 class="text-[17px] font-bold text-nf-ink">Courses already taken</h2>
                <span class="text-xs font-semibold text-nf-teal bg-nf-mint px-2.5 py-0.5 rounded-full">42 credits</span>
              </div>
              <p class="text-xs text-nf-muted mb-4">Freshman Year (2025–26) & Fall 2026 coursework</p>

              <div class="space-y-2.5">
                ${TAKEN_COURSES.map(tc => `
                  <div class="bg-nf-surface border border-nf-border/80 rounded-xl p-3.5 flex items-start justify-between gap-3">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-nf-teal">${tc.code}</span>
                        <span class="text-[11px] text-nf-muted">· ${tc.term}</span>
                      </div>
                      <div class="text-[13px] font-semibold text-nf-ink mt-0.5">${tc.title}</div>
                      <div class="text-[11px] text-nf-muted mt-0.5">${tc.category}</div>
                    </div>
                    <div class="text-right shrink-0">
                      <div class="text-xs font-bold text-nf-ink">${tc.credits} cr</div>
                      <div class="text-[11px] ${tc.grade === 'In Progress' ? 'text-nf-amberText font-semibold' : 'text-nf-muted'} mt-0.5">${tc.grade}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>

            <section class="lg:col-span-7 bg-white border border-nf-border rounded-2xl p-6">
              <div class="flex items-center justify-between mb-1">
                <h2 class="text-[17px] font-bold text-nf-ink">BSE HCDE Degree Requirements</h2>
                <span class="text-xs text-nf-muted">Live sync with Spring 2027 list</span>
              </div>
              <p class="text-xs text-nf-muted mb-5">Courses currently in your Spring 2027 registration list are highlighted.</p>

              <div class="space-y-4">
                ${DEGREE_REQUIREMENTS.map(req => {
                  const isComplete = req.remainingOptions.length === 0;
                  return `
                    <div class="border ${isComplete ? 'border-nf-mintBorder bg-nf-mint/25' : 'border-nf-border bg-white'} rounded-xl p-4">
                      <div class="flex items-center justify-between gap-2 mb-1.5">
                        <h3 class="text-[15px] font-bold text-nf-ink">${req.area}</h3>
                        <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${isComplete ? 'bg-nf-mint text-nf-teal' : 'bg-nf-surface text-nf-muted border border-nf-border'}">
                          ${isComplete ? 'Completed' : 'In Progress'}
                        </span>
                      </div>
                      <p class="text-xs text-nf-muted mb-3">${req.note}</p>

                      <div class="mb-2">
                        <div class="text-[10px] font-bold tracking-wider text-nf-muted uppercase mb-1">Applied from transcript</div>
                        <div class="flex flex-wrap gap-1.5">
                          ${req.completedCodes.map(code => `
                            <span class="text-xs font-semibold bg-nf-surface border border-nf-border text-nf-ink px-2.5 py-1 rounded-md">
                              ✓ ${code}
                            </span>
                          `).join('')}
                        </div>
                      </div>

                      ${req.remainingOptions.length > 0 ? `
                        <div class="mt-3 pt-2.5 border-t border-nf-border/60">
                          <div class="text-[10px] font-bold tracking-wider text-nf-teal uppercase mb-1.5">Remaining required / eligible options</div>
                          <div class="space-y-1.5">
                            ${req.remainingOptions.map(opt => {
                              const optCode = opt.split(' · ')[0];
                              const inSpringList = plannedIds.includes(optCode);
                              return `
                                <div class="flex items-center justify-between text-xs px-2.5 py-1.5 rounded-lg ${inSpringList ? 'bg-nf-mint text-nf-teal font-semibold' : 'bg-nf-surface text-nf-ink'}">
                                  <span>${opt}</span>
                                  ${inSpringList ? '<span class="text-[10px] uppercase tracking-wider font-bold">In Spring 2027 List</span>' : ''}
                                </div>
                              `;
                            }).join('')}
                          </div>
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          </div>
        </main>
      `;
    }

    // =========================================================================
    // RENDER: POP-UP MODALS
    // =========================================================================
    function renderModal() {
      const backdrop = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');

      if (!state.modal) {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
        content.innerHTML = '';
        return;
      }

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');

      if (state.modal === 'existing_plan') {
        content.className = 'w-full max-w-[490px] bg-white rounded-2xl shadow-2xl border border-nf-border p-7';
        content.innerHTML = `
          <div class="text-[10px] font-bold tracking-wider text-nf-teal uppercase mb-2">SPRING 2027 / COURSE PLAN</div>
          <h2 class="text-[22px] font-bold text-nf-ink mb-2">You’ve already created a plan</h2>
          <p class="text-[14px] text-nf-muted leading-relaxed mb-6">
            You’ve already created a plan for Spring 2027. Would you like to create a new plan?
          </p>
          <div class="space-y-2.5">
            <button type="button" data-action="modal-continue-to-reg" class="w-full py-3 px-4 rounded-xl bg-nf-teal hover:bg-nf-tealHover text-white text-[13px] font-semibold transition">
              continue to registration
            </button>
            <button type="button" data-action="modal-create-new-plan" class="w-full py-3 px-4 rounded-xl bg-nf-surface hover:bg-slate-200/70 text-nf-muted text-[13px] font-semibold transition">
              create a new plan
            </button>
          </div>
        `;
        return;
      }

      if (state.modal === 'selection_required') {
        content.className = 'w-full max-w-[460px] bg-white rounded-2xl shadow-2xl border border-nf-border p-7';
        content.innerHTML = `
          <h2 class="text-[20px] font-bold text-nf-ink mb-2">Select a course first</h2>
          <p class="text-[14px] text-nf-muted mb-6">Select at least one course, then try again.</p>
          <button type="button" data-action="close-modal" class="w-full py-3 px-4 rounded-xl bg-nf-teal hover:bg-nf-tealHover text-white text-[13px] font-semibold transition">
            Back to courses
          </button>
        `;
        return;
      }

      if (state.modal === 'courses_saved') {
        content.className = 'w-full max-w-[470px] bg-white rounded-2xl shadow-2xl border border-nf-border p-7';
        content.innerHTML = `
          <div class="text-[10px] font-bold tracking-wider text-nf-teal uppercase mb-2">SPRING 2027 / SAVED</div>
          <h2 class="text-[22px] font-bold text-nf-ink mb-2">Courses added to your schedule</h2>
          <p class="text-[14px] text-nf-muted mb-6">You’ve successfully added your selected courses to your schedule.</p>
          <button type="button" data-action="confirm-saved-continue" class="w-full py-3 px-4 rounded-xl bg-nf-teal hover:bg-nf-tealHover text-white text-[13px] font-semibold transition">
            Continue
          </button>
        `;
        return;
      }

      if (state.modal === 'waitlist_added') {
        const waitlistedNames = state.lastSavedWaitlistedCourses.map(c => `${c.code} (${c.title})`).join(', ') || 'STAT 221';
        content.className = 'w-full max-w-[510px] bg-white rounded-2xl shadow-2xl border border-nf-border p-7';
        content.innerHTML = `
          <div class="text-[10px] font-bold tracking-wider text-nf-amberText uppercase mb-2">SPRING 2027 / WAITLIST</div>
          <h2 class="text-[22px] font-bold text-nf-ink mb-2">Added to course waitlist</h2>
          <p class="text-[14px] text-nf-muted leading-relaxed mb-4">
            You have been added to the waitlist for <span class="font-semibold text-nf-ink">${waitlistedNames}</span>. You will be notified by email if a seat opens up and you make it into the class.
          </p>

          <div class="bg-nf-amberBg border border-amber-200 rounded-xl p-3.5 text-xs text-nf-amberText leading-relaxed mb-5">
            <span class="font-bold">Note:</span> You will remain on the course waitlist until you are added to the class or you remove the course from your schedule.
          </div>

          <div class="text-[14px] font-semibold text-nf-ink mb-3">
            Would you like to explore alternative courses that fit your schedule?
          </div>

          <div class="space-y-2.5">
            <button type="button" data-action="open-alternatives" class="w-full py-3 px-4 rounded-xl bg-nf-teal hover:bg-nf-tealHover text-white text-[13px] font-semibold transition">
              Yes, explore alternatives
            </button>
            <button type="button" data-action="close-modal" class="w-full py-3 px-4 rounded-xl bg-nf-surface hover:bg-slate-200/70 text-nf-ink text-[13px] font-semibold border border-nf-border transition">
              No, back to registration
            </button>
          </div>
        `;
        return;
      }

      if (state.modal === 'explore_alternatives') {
        const alternatives = getNonConflictingAlternatives();
        const openCodes = state.yourCourses
          .map(i => getCourse(i.courseId))
          .filter(c => c && c.seatsAvailable > 0)
          .map(c => c.code);
        const fitSummary = openCodes.length > 0 ? openCodes.join(', ') : 'your current schedule';
        const waitlistedCode = state.lastSavedWaitlistedCourses[0]?.code || 'STAT 221';

        const outstanding = getOutstandingRequirementCourses();
        const outstandingTotal = outstanding.reduce((sum, o) => sum + (o.credits || 0), 0);

        content.className = 'w-full max-w-[600px] bg-white rounded-2xl shadow-2xl border border-nf-border p-7 max-h-[90vh] overflow-y-auto custom-scroll';
        content.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-1">
            <div class="text-[10px] font-bold tracking-wider text-nf-teal uppercase">SPRING 2027 / NO TIME CONFLICTS</div>
            <button
              type="button"
              data-action="toggle-taken-in-alternatives"
              class="text-xs font-semibold px-3 py-1 rounded-lg border transition ${
                state.showTakenInAlternatives
                  ? 'bg-nf-dark text-white border-nf-dark'
                  : 'bg-nf-mint/70 text-nf-teal border-nf-mintBorder hover:bg-nf-mint'
              }"
            >
              ${state.showTakenInAlternatives ? 'Hide taken & required courses' : 'View taken & required courses'}
            </button>
          </div>

          <h2 class="text-[24px] font-bold text-nf-ink mb-1.5">Explore courses that fit</h2>
          <p class="text-[13px] text-nf-muted mb-4">
            These courses fit around ${fitSummary}. Select any alternatives to add them to Your courses.
          </p>

          ${state.showTakenInAlternatives ? `
            <div class="mb-4 bg-nf-surface border border-nf-border rounded-xl p-4">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-nf-ink">Alex Smith’s Completed & Current Courses (Sophomore · BSE HCDE)</span>
                <span class="text-[11px] font-semibold text-nf-teal">42 credits</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[160px] overflow-y-auto custom-scroll pr-1">
                ${TAKEN_COURSES.map(tc => `
                  <div class="bg-white border border-nf-border/80 rounded-lg px-2.5 py-2 text-xs">
                    <div class="font-bold text-nf-ink">${tc.code} <span class="font-normal text-nf-muted">(${tc.term})</span></div>
                    <div class="text-nf-muted truncate">${tc.title}</div>
                    <div class="text-[10px] text-nf-teal font-medium mt-0.5">${tc.category}</div>
                  </div>
                `).join('')}
              </div>

              <div class="mt-3 pt-3 border-t border-nf-border/60">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-bold text-nf-ink">Outstanding major / degree requirements</span>
                  <span class="text-[11px] font-semibold text-nf-amberText">${outstanding.length} course${outstanding.length === 1 ? '' : 's'} · ${outstandingTotal} cr remaining</span>
                </div>
                <div class="text-[11px] text-nf-muted mb-2">Courses Alex still needs to complete the BSE HCDE degree. Compare these against the alternatives below.</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[220px] overflow-y-auto custom-scroll pr-1">
                  ${outstanding.map(o => `
                    <div class="bg-nf-amberBg/70 border border-amber-200 rounded-lg px-2.5 py-2 text-xs">
                      <div class="font-bold text-nf-ink">${o.code}${o.credits ? ` <span class="font-normal text-nf-muted">(${o.credits} cr)</span>` : ''}</div>
                      <div class="text-nf-muted truncate">${o.title}</div>
                      <div class="text-[10px] text-nf-amberText font-medium mt-0.5">${o.area}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          ` : ''}

          <div class="space-y-2.5 mb-4">
            ${alternatives.map(alt => {
              const isChecked = state.alternativeCheckedIds.includes(alt.id);
              return `
                <label class="flex items-start gap-3.5 bg-nf-surface hover:bg-nf-mint/30 border ${isChecked ? 'border-nf-teal' : 'border-nf-border'} rounded-xl p-4 cursor-pointer transition">
                  <input
                    type="checkbox"
                    class="nf-checkbox mt-0.5"
                    data-action="toggle-alt-course"
                    data-course-id="${alt.id}"
                    ${isChecked ? 'checked' : ''}
                  />
                  <div class="flex-1">
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-[14px] font-bold text-nf-ink">${alt.code} · ${alt.title}</span>
                      <span class="text-[11px] font-semibold text-nf-teal bg-nf-mint px-2 py-0.5 rounded">${alt.reqArea}</span>
                    </div>
                    <div class="text-xs text-nf-muted mt-1">${alt.daysLabel} · ${alt.timeLabel} · ${alt.credits} credits</div>
                    <div class="text-xs font-semibold text-nf-teal mt-1">${alt.seatsAvailable} seats available · ${alt.waitlistAvailable} waitlist seats available</div>
                  </div>
                </label>
              `;
            }).join('')}
          </div>

          <div class="bg-nf-mint/75 border border-nf-mintBorder rounded-xl px-4 py-3 mb-3">
            <div class="text-xs font-bold text-nf-teal">Adding to your list does not save the course.</div>
            <div class="text-xs text-nf-teal/90 mt-0.5">Back on registration, tick the course in Your courses and click Add courses to schedule to save it.</div>
          </div>

          <div class="text-xs text-nf-muted mb-4">
            You remain on the ${waitlistedCode} waitlist unless you remove that course.
          </div>

          <div class="space-y-2.5">
            <button type="button" data-action="add-alternatives-to-list" class="w-full py-3 px-4 rounded-xl bg-nf-teal hover:bg-nf-tealHover text-white text-[13px] font-semibold transition">
              Add to your course list
            </button>
            <button type="button" data-action="close-modal" class="w-full py-3 px-4 rounded-xl bg-nf-surface hover:bg-slate-200/70 text-nf-ink text-[13px] font-semibold border border-nf-border transition">
              Back to registration
            </button>
          </div>
        `;
      }
    }

    // =========================================================================
    // MASTER RENDER & EVENT DELEGATION
    // =========================================================================
    function render() {
      const root = document.getElementById('appRoot');

      if (state.screen === 'dashboard') {
        root.innerHTML = renderDashboard();
      } else if (state.screen === 'hub') {
        root.innerHTML = renderHub();
      } else if (state.screen === 'register') {
        root.innerHTML = renderRegister();
      } else if (state.screen === 'requirements') {
        root.innerHTML = renderRequirements();
      }

      renderModal();

      const searchInput = document.getElementById('courseSearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', e => {
          const caret = e.target.selectionStart;
          state.searchQuery = e.target.value;
          render();
          const refreshed = document.getElementById('courseSearchInput');
          if (refreshed) {
            refreshed.focus();
            refreshed.setSelectionRange(caret, caret);
          }
        });
      }
    }

    // Global click delegation
    document.addEventListener('click', e => {
      const target = e.target.closest('[data-action]');
      if (!target) return;

      const action = target.getAttribute('data-action');

      switch (action) {
        case 'go-dashboard':
          state.screen = 'dashboard';
          state.modal = null;
          state.showPortalPrompt = false;
          state.dismissedPortalPrompt = false;
          render();
          break;
        case 'go-hub':
          state.screen = 'hub';
          state.modal = null;
          render();
          break;
        case 'go-register':
          state.screen = 'register';
          state.modal = null;
          render();
          break;
        case 'go-requirements':
          state.screen = 'requirements';
          state.modal = null;
          render();
          break;
        case 'go-portal-from-prompt':
          state.screen = 'dashboard';
          state.modal = null;
          state.showPortalPrompt = false;
          state.dismissedPortalPrompt = false;
          render();
          break;
        case 'dismiss-portal-prompt':
          state.dismissedPortalPrompt = true;
          render();
          break;
        case 'open-existing-plan-modal':
          state.modal = 'existing_plan';
          render();
          break;
        case 'modal-continue-to-reg':
          state.modal = null;
          state.screen = 'register';
          if (!state.planImported && state.yourCourses.length === 0) {
            importSpringPlan();
          } else {
            render();
          }
          break;
        case 'modal-create-new-plan':
          state.modal = null;
          state.screen = 'register';
          state.planImported = false;
          state.yourCourses = [];
          render();
          break;
        case 'import-plan':
          importSpringPlan();
          break;
        case 'clear-search':
          state.searchQuery = '';
          render();
          break;
        case 'add-courses-to-schedule':
          handleAddCoursesToSchedule();
          break;
        case 'remove-courses':
          handleRemoveSelectedCourses();
          break;
        case 'confirm-saved-continue':
          handleConfirmationContinue();
          break;
        case 'open-alternatives':
          openExploreAlternatives();
          break;
        case 'toggle-taken-in-alternatives':
          state.showTakenInAlternatives = !state.showTakenInAlternatives;
          render();
          break;
        case 'add-alternatives-to-list':
          addAlternativesToYourList();
          break;
        case 'close-modal':
          state.modal = null;
          render();
          break;
      }
    });

    // Global checkbox change delegation
    document.addEventListener('change', e => {
      const target = e.target.closest('[data-action]');
      if (!target) return;

      const action = target.getAttribute('data-action');
      const courseId = target.getAttribute('data-course-id');

      if (action === 'toggle-catalog-course' && courseId) {
        toggleCourseSelection(courseId);
      } else if (action === 'toggle-your-course' && courseId) {
        toggleYourCourseCheckbox(courseId);
      } else if (action === 'toggle-alt-course' && courseId) {
        if (state.alternativeCheckedIds.includes(courseId)) {
          state.alternativeCheckedIds = state.alternativeCheckedIds.filter(id => id !== courseId);
        } else {
          state.alternativeCheckedIds.push(courseId);
        }
        render();
      }
    });

    // Header buttons
    document.getElementById('brandHomeBtn').addEventListener('click', () => {
      state.screen = 'dashboard';
      state.modal = null;
      state.showPortalPrompt = false;
      state.dismissedPortalPrompt = false;
      render();
    });

    document.getElementById('headerDegreeBtn').addEventListener('click', () => {
      state.screen = 'requirements';
      state.modal = null;
      render();
    });

    // Initial render
    render();
  </script>
</body>
</html>
